# IRUZ ランディングページ配信 Worker。
# iruz.kagayoi.com は R2 バケット iruz-updates のカスタムドメイン。
# 下のルートを被せると Worker が Custom Domain より優先され、worker.js が
# "/" のみランディングページを返し、それ以外のパスは R2 にそのまま委譲する。
name = "iruz-landing"
main = "worker.js"
compatibility_date = "2026-05-01"

routes = [
  { pattern = "iruz.kagayoi.com/*", zone_name = "kagayoi.com" },
  { pattern = "iruz.nephilim.jp/*", zone_name = "nephilim.jp" },
]

# index.html を文字列として worker.js に import する（Text モジュール）。
[[rules]]
type = "Text"
globs = ["**/*.html"]
