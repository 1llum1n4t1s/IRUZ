name: Velopack リリース作成

on:
  push:

# 踏み台 1.0.12 をワンタイムで GitHub Releases にも publish するため contents: write に一時昇格。
# (このブランチ release/1.0.12 限定。main は contents: read のまま R2 単独配信)
permissions:
  contents: write

# 複数の release/** push が overlap したときに cleanup の race condition を防ぐため直列化する。
# cancel-in-progress: false = 走っている run を完走させてから次を queue する (削除途中の中断を避ける)。
concurrency:
  group: release-r2
  cancel-in-progress: false

jobs:
  build-release:
    name: Velopack パッケージ作成
    runs-on: windows-latest
    if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: アイコン生成
        shell: pwsh
        run: .\icon\generate_icon.ps1

      - name: 依存関係を復元
        run: dotnet restore IRUZ.slnx

      - name: リリースバージョンを設定
        shell: pwsh
        run: |
          # csproj からバージョンを読み取る
          $csprojPath = "IRUZ.csproj"
          $version = $null

          # 正規表現でバージョンを抽出
          $content = Get-Content -Path $csprojPath -Raw
          if ($content -match '<Version>([^<]+)</Version>') {
            $version = $matches[1]
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Version not found in csproj at: $csprojPath"
            Write-Host "csproj content:"
            Get-Content -Path $csprojPath | Select-Object -First 30
            exit 1
          }

          Write-Host "Version found: $version"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RELEASE_VERSION=$version" -Encoding utf8

      - name: ターゲットフレームワークを取得
        shell: pwsh
        run: |
          # csproj または Directory.Build.props からターゲットフレームワークを読み取る
          $targetFramework = $null
          foreach ($path in @("IRUZ.csproj", "Directory.Build.props")) {
            if (-not (Test-Path $path)) { continue }
            $content = Get-Content -Path $path -Raw
            if ($content -match '<TargetFramework>([^<]+)</TargetFramework>') {
              $targetFramework = $matches[1]
              Write-Host "TargetFramework read from: $path"
              break
            }
          }

          if ([string]::IsNullOrWhiteSpace($targetFramework)) {
            Write-Error "TargetFramework not found in IRUZ.csproj or Directory.Build.props"
            exit 1
          }

          Write-Host "TargetFramework found: $targetFramework"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TARGET_FRAMEWORK=$targetFramework" -Encoding utf8

      - name: アプリを公開ビルド
        shell: pwsh
        run: |
          $publishDir = Join-Path "bin" "Release" "$env:TARGET_FRAMEWORK" "win-x64" "publish"
          if (Test-Path $publishDir) {
            Remove-Item -Path $publishDir -Recurse -Force
          }

          Write-Host "Building and publishing application..."
          Write-Host "Target Framework: $env:TARGET_FRAMEWORK"
          Write-Host "Publish Dir: $publishDir"
          dotnet publish "IRUZ.csproj" `
            -c Release `
            -r win-x64

          if ($LASTEXITCODE -ne 0) {
            Write-Error "dotnet publish failed with exit code $LASTEXITCODE"
            exit 1
          }

          Write-Host "Publish directory contents:"
          Get-ChildItem -Path $publishDir -Recurse -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { Write-Host $_.FullName }

          $exePath = Join-Path $publishDir "IRUZ.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "IRUZ.exe not found at: $exePath"
            exit 1
          }
          Write-Host "Successfully built: $exePath"

      - name: Velopack CLI をインストール
        shell: pwsh
        run: |
          dotnet tool install --global vpk
          $toolsPath = "$env:USERPROFILE\.dotnet\tools"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $toolsPath -Encoding utf8
          Write-Host "Velopack CLI installed to: $toolsPath"
          Write-Host "PATH environment updated"

      - name: Velopack パッケージを作成
        shell: pwsh
        run: |
          $publishDir = Join-Path "bin" "Release" "$env:TARGET_FRAMEWORK" "win-x64" "publish"
          $outputDir = "artifacts"
          $iconPath = Join-Path "icon" "app.ico"

          if (-not (Test-Path $publishDir)) {
            Write-Error "Publish directory not found: $publishDir"
            exit 1
          }

          if (Test-Path $outputDir) {
            Remove-Item -Path $outputDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          Write-Host "Creating Velopack package..."
          Write-Host "  Pack ID: IRUZ"
          Write-Host "  Version: $env:RELEASE_VERSION"
          Write-Host "  Title: IRUZ"
          Write-Host "  Main EXE: IRUZ.exe"
          Write-Host "  Publish Dir: $publishDir"
          Write-Host "  Output Dir: $outputDir"
          Write-Host "  Icon: $iconPath"

          vpk pack `
            --packId IRUZ `
            --packVersion $env:RELEASE_VERSION `
            --packTitle "IRUZ" `
            --packAuthors "IRUZ" `
            --mainExe IRUZ.exe `
            --icon $iconPath `
            --packDir $publishDir `
            --outputDir $outputDir `
            --shortcuts "StartMenu,Desktop"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "vpk pack failed with exit code $LASTEXITCODE"
            exit 1
          }

          Write-Host "Velopack パッケージ作成完了"
          Write-Host "Artifacts directory contents:"
          if (Test-Path $outputDir) {
            Get-ChildItem -Path $outputDir -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
          } else {
            Write-Error "Artifacts directory was not created"
            exit 1
          }

      # 踏み台ワンタイム: 旧 GithubSource クライアント (1.0.11) が更新で拾えるよう
      # GitHub Releases にも 1.0.12 を publish する。main には存在しないステップで、
      # この release/1.0.12 ブランチでのみ実行される。
      - name: GitHub Releases にアップロード (踏み台ワンタイム / release/1.0.12 限定)
        shell: pwsh
        run: |
          $repoUrl = "https://github.com/${{ github.repository }}"
          vpk upload github `
            --repoUrl $repoUrl `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir artifacts `
            --channel win `
            --publish `
            --releaseName "IRUZ $env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "vpk upload github failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Velopack 成果物を artifact としてアップロード
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velopack-package
          path: artifacts/
          if-no-files-found: error
          retention-days: 1

  r2-upload:
    needs: build-release
    name: R2 Upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Velopack 成果物をダウンロード
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: velopack-package
          path: packages

      - name: 成果物を確認
        run: ls -lh packages/

      - name: Node.js セットアップ (wrangler 4.x が Node.js >=22 を要求)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: wrangler CLI をインストール
        # サプライチェーン攻撃防止のため明示的にバージョン固定
        run: npm install -g wrangler@4.95.0

      # 同名 releases.win.json は冪等に上書き、リリース完了後に旧バージョン nupkg は自動削除
      # (cleanup step で manifest 外を掃除する)
      - name: R2 バケット iruz-updates にアップロード
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          uploaded=0
          for f in packages/*; do
            name=$(basename "$f")
            echo "::group::Upload $name"
            wrangler r2 object put "iruz-updates/$name" --file="$f" --remote
            echo "::endgroup::"
            uploaded=$((uploaded + 1))
          done
          echo "✅ R2 アップロード完了: $uploaded ファイル"

      - name: 配信確認 (releases.win.json の HTTP 200 を検証)
        run: |
          set -euo pipefail
          base="https://iruz.nephilim.jp"
          for channel in win; do
            url="${base}/releases.${channel}.json"
            curl --fail --silent --show-error --max-time 30 \
                 --retry 3 --retry-delay 5 --retry-all-errors \
                 -o /dev/null -w "HTTP %{http_code} (%{size_download} bytes)\n" \
                 "$url"
          done

      # 旧バージョン nupkg のクリーンアップ (Aggressive 戦略):
      # - releases.win.json (manifest) に含まれない *.nupkg を削除
      # - Setup.exe / Portable.zip / RELEASES / assets.*.json / releases.*.json は
      #   固定ファイル名で毎リリース上書きされる Velopack 内部 & ランディング DL 用なので保護
      # - 削除対象を「.nupkg かつ manifest 外」に絞ることで、想定外のファイル
      #   (誰かが手動 put した object) を誤って消さない安全側設計
      # - 配信確認ステップ後に走る (manifest 取得不能なら手前で fail し cleanup は走らない)
      # - API: Cloudflare V4 で完結 (CLOUDFLARE_API_TOKEN だけで動く / R2 S3 互換 Access Key 不要)
      - name: 旧バージョン nupkg を削除 (manifest 外をクリーンアップ)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/iruz-updates"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          # 1. ローカル packages/ の manifest (=今アップロードしたものと同一) から keep set 構築。
          #    public endpoint から fetch すると CDN/R2 の伝播タイミング次第で「アップロード前の
          #    旧 manifest」が返り、新 nupkg が keep_map に入らずに削除される race condition がある。
          #    ローカル artifact から読めば伝播遅延に依存しない。
          declare -A keep_map
          shopt -s nullglob
          local_manifests=(packages/releases.*.json)
          shopt -u nullglob

          if [[ "${#local_manifests[@]}" -eq 0 ]]; then
            echo "::error::packages/releases.*.json が見つかりません。Velopack 成果物のダウンロードに失敗している可能性があります。"
            exit 1
          fi

          for manifest_path in "${local_manifests[@]}"; do
            echo "Reading local manifest: $manifest_path"
            while IFS= read -r filename; do
              if [[ -n "$filename" && "$filename" != "null" ]]; then
                keep_map["$filename"]=1
              fi
            done < <(jq -r '.Assets[]?.FileName // empty' "$manifest_path")
          done

          echo "::group::manifest 内の保持対象 nupkg (${#keep_map[@]} files)"
          for k in "${!keep_map[@]}"; do echo "  $k"; done | sort
          echo "::endgroup::"

          # 2. R2 上の全 object を cursor ページネーション付きで取得
          all_keys=()
          cursor=""
          while true; do
            if [[ -n "$cursor" ]]; then
              resp=$(curl --fail --silent --max-time 30 "${api}/objects?per_page=1000&cursor=${cursor}" -H "$auth_header")
            else
              resp=$(curl --fail --silent --max-time 30 "${api}/objects?per_page=1000" -H "$auth_header")
            fi
            while IFS= read -r k; do
              [[ -n "$k" ]] && all_keys+=("$k")
            done < <(echo "$resp" | jq -r '.result[]?.key')
            truncated=$(echo "$resp" | jq -r '.result_info.is_truncated // false')
            [[ "$truncated" != "true" ]] && break
            cursor=$(echo "$resp" | jq -r '.result_info.cursor // ""')
            [[ -z "$cursor" || "$cursor" == "null" ]] && break
          done

          echo "::group::R2 内全オブジェクト (${#all_keys[@]} files)"
          printf '  %s\n' "${all_keys[@]}"
          echo "::endgroup::"

          # 3. 削除対象判定: 拡張子 .nupkg のもののみ対象 + keep_map 外
          to_delete=()
          for key in "${all_keys[@]}"; do
            [[ "$key" != *.nupkg ]] && continue
            [[ -n "${keep_map[$key]:-}" ]] && continue
            to_delete+=("$key")
          done

          if [[ "${#to_delete[@]}" -eq 0 ]]; then
            echo "✅ 削除対象なし - R2 上の全 nupkg が manifest に含まれています"
            exit 0
          fi

          echo "::group::削除対象 (${#to_delete[@]} files)"
          printf '  %s\n' "${to_delete[@]}"
          echo "::endgroup::"

          # 4. 一個ずつ DELETE
          deleted=0
          failed=0
          for key in "${to_delete[@]}"; do
            encoded=$(jq -nr --arg k "$key" '$k|@uri')
            resp=$(curl --silent --max-time 30 -X DELETE "${api}/objects/${encoded}" -H "$auth_header")
            success=$(echo "$resp" | jq -r '.success')
            if [[ "$success" == "true" ]]; then
              echo "  🗑️  Deleted: $key"
              deleted=$((deleted + 1))
            else
              echo "  ❌ Failed: $key"
              echo "$resp" | jq -r '.errors[]?.message' | sed 's/^/      /'
              failed=$((failed + 1))
            fi
          done

          echo ""
          echo "🧹 R2 クリーンアップ完了: $deleted / ${#to_delete[@]} 削除  (失敗: $failed)"
          # 失敗があってもリリース自体は成功扱い (削除失敗は次回リリースで再試行される)
          # ただし全件失敗の場合はワークフロー失敗にして気付けるようにする
          if [[ "$failed" -gt 0 && "$deleted" -eq 0 ]]; then
            echo "::error::すべての削除が失敗しました。API token の権限・bucket 名を確認してください。"
            exit 1
          fi
