permissions:
  contents: read

# 同じ PR の古い検証 run は新しい push で取り消す。main への push は run ごとに独立して完走する。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

name: .NET ビルド

on:
  workflow_dispatch:
  pull_request:
  # main へ直接 push した変更も検証する(配信は版タグの push で起動する release.yml が担い、このワークフローはタグでは起動しない)。
  push:
    branches:
      - main

jobs:
  build:
    name: .NET ビルド
    runs-on: windows-latest
    # 復元・ビルド・テストの想定は 10 分前後。ハング時にランナーを占有し続けないよう上限を付ける。
    timeout-minutes: 30
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify R2 transfer fixtures
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/R2Transfer/Run.ps1') -WorkRoot (Join-Path $env:RUNNER_TEMP 'r2-transfer-check')
      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
      - name: Restore NuGet package cache
        id: nuget-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/release/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-dotnet-build-${{ github.job }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props', '**/packages*.lock.json', '**/global.json', '**/nuget.config', '**/NuGet.config', '**/NuGet.Config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-dotnet-build-${{ github.job }}-
            ${{ runner.os }}-nuget-

      - name: アイコン生成
        shell: pwsh
        run: .\icon\generate_icon.ps1

      - name: 依存関係を復元
        run: dotnet restore IRUZ.slnx --locked-mode
      - name: Save NuGet package cache
        if: ${{ github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - name: ビルド
        run: dotnet build IRUZ.slnx --configuration Release --no-restore

      - name: テスト実行
        run: dotnet test --solution IRUZ.slnx --configuration Release --no-build --verbosity normal -- --report-xunit-trx --report-xunit-trx-filename test-results.trx --minimum-expected-tests 1

      - name: テスト結果をアップロード
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-Release
          path: '**/TestResults/*.trx'
          if-no-files-found: error
          retention-days: 1

      - name: ビルド成果物をアップロード
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts-release
          path: |
            bin/**/Release/**/*.exe
            bin/**/Release/**/*.dll
            !bin/**/Release/**/ref/**
          retention-days: 1
