permissions:
  contents: read

# 同じ ref の古い検証 run は新しい push で取り消す。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: .NET ビルド

on:
  workflow_dispatch:
  pull_request:
  # main へ直接 push した変更も検証する(配信は版タグの push で起動する release.yml が担い、このワークフローはタグでは起動しない)。
  push:
    branches:
      - main

jobs:
  build:
    name: .NET ビルド
    runs-on: windows-latest
    # 復元・ビルド・テストの想定は 10 分前後。ハング時にランナーを占有し続けないよう上限を付ける。
    timeout-minutes: 30
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify R2 transfer fixtures
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/R2Transfer/Run.ps1') -WorkRoot (Join-Path $env:RUNNER_TEMP 'r2-transfer-check')
      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '11.0.x'

      - name: アイコン生成
        shell: pwsh
        run: .\icon\generate_icon.ps1

      - name: 依存関係を復元
        run: dotnet restore IRUZ.slnx --locked-mode

      - name: ビルド
        run: dotnet build IRUZ.slnx --configuration Release --no-restore

      - name: テスト実行
        run: dotnet test --solution IRUZ.slnx --configuration Release --no-build --verbosity normal -- --report-xunit-trx --report-xunit-trx-filename test-results.trx --minimum-expected-tests 1

      - name: テスト結果をアップロード
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-Release
          path: '**/TestResults/*.trx'
          if-no-files-found: error
          retention-days: 1

      - name: ビルド成果物をアップロード
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts-release
          path: |
            bin/**/Release/**/*.exe
            bin/**/Release/**/*.dll
            !bin/**/Release/**/ref/**
          retention-days: 1
